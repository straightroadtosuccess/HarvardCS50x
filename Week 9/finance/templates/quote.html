{% extends "layout.html" %}

{% block title %}Quote{% endblock %}

{% block main %}
<h2>Get Stock Quote</h2>

<form action="{{ url_for('quote') }}" method="post">
    <div>
        <label for="symbol">Symbol</label>
        <input type="text" name="symbol" id="symbol" placeholder="e.g. AAPL, TSLA, AMZN" required>
    </div>
    <button type="submit">Get Quote</button>
</form>

<hr>

<h3>Popular Symbols</h3>
<ul>
    <li><strong>AAPL</strong> – Apple Inc.</li>
    <li><strong>TSLA</strong> – Tesla, Inc.</li>
    <li><strong>AMZN</strong> – Amazon.com, Inc.</li>
    <li><strong>GOOGL</strong> – Alphabet Inc.</li>
    <li><strong>MSFT</strong> – Microsoft Corporation</li>
    <li><strong>NVDA</strong> – NVIDIA Corporation</li>
</ul>
{% endblock %}
