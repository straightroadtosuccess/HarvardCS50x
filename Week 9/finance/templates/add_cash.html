{% extends "layout.html" %}
{% block title %}Add Cash{% endblock %}
{% block main %}
<h2>Add Cash</h2>
<form action="{{ url_for('add_cash') }}" method="post">
    <div>
        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" step="0.01" min="1" required>
    </div>
    <button type="submit">Add</button>
</form>
{% endblock %}
