{% extends "layout.html" %}

{% block title %}Sell{% endblock %}

{% block main %}
<h2>Sell Stocks</h2>

<form action="{{ url_for('sell') }}" method="post">
    <div>
        <label for="symbol">Symbol</label>
        <select name="symbol" id="symbol" required>
            <option value="">Select a stock</option>
            {% for stock in stocks %}
            <option value="{{ stock.symbol }}">{{ stock.symbol }} ({{ stock.shares }} shares)</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label for="shares">Shares to sell</label>
        <input type="number" name="shares" id="shares" min="1" required>
    </div>
    <button type="submit">Sell</button>
</form>
{% endblock %}
